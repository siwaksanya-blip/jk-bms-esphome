esphome:
  name: jk-bms
  friendly_name: "JK BMS Monitor"

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !env_var WIFI_SSID
  password: !env_var WIFI_PASSWORD
  
  ap:
    ssid: "BMS-Setup-Portal"
    password: "password123"
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

captive_portal:

logger:
  level: DEBUG

# UART для BMS: TX на 16, RX на 17
uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  id: bms_uart

sensor:
  - platform: uptime
    name: "Uptime"
  
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

  # Аналоговый вход на пине 18
  - platform: adc
    pin: GPIO18
    name: "Aux Voltage 1"
    attenuation: auto
    update_interval: 5s

  # Аналоговый вход на пине 19
  - platform: adc
    pin: GPIO19
    name: "Aux Voltage 2"
    attenuation: auto
    update_interval: 5s

text_sensor:
  - platform: version
    name: "ESPHome Version"
