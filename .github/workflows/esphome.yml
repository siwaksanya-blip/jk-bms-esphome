name: Build ESPHome Firmware

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome
        run: pip install esphome==2024.8.4

      - name: Build firmware
        env:
          WIFI_SSID: \${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: \${{ secrets.WIFI_PASSWORD }}
        run: esphome run jk-bms.yaml --no-ota-upload --subs WIFI_SSID=$WIFI_SSID,WIFI_PASSWORD=$WIFI_PASSWORD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            jk-bms.factory.bin
            jk-bms.spiffs.bin
