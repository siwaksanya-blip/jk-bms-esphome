name: Build ESPHome Firmware

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome
        # Используем 2024.8.3, так как версии .4 не существует в PyPI
        run: pip install esphome==2024.8.3

      - name: Build firmware
        # ВАЖНО: Проверь имя файла ниже. Если твой конфиг называется esphome.yaml, замени jk-bms.yaml на esphome.yaml
        run: esphome compile jk-bms.yaml
        env:
          WIFI_SSID: \${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: \${{ secrets.WIFI_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: .esphome/*.bin
