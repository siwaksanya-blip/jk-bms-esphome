esphome:
  name: jk-bms-clean
  friendly_name: "JK BMS Clean Build"

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !env_var WIFI_SSID
  password: !env_var WIFI_PASSWORD
  ap:
    ssid: "BMS-Setup-Portal"
    password: "password123"
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

captive_portal:

logger:
  level: DEBUG
  baud_rate: 0

uart:
  # Порт для BMS (Modbus)
  - id: bms_uart
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 115200
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

  # Порт для Инвертора (Отправка команды + Чтение ответа)
  - id: inverter_uart
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 9600
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256

# Текстовый сенсор для автоматического чтения данных с инвертора
# Он слушает порт и срабатывает, когда приходят данные
text_sensor:
  - platform: uart
    uart_id: inverter_uart
    name: "Inverter Raw Response"
    id: inverter_resp
    on_value:
      then:
        - logger.log: "Inverter ACK received: %s"
          variables:
            data_str: "data"

# Скрипт отправки команды
script:
  - id: send_voltronic_bms_command
    mode: single
    then:
      - logger.log: "Sending Voltronic BMS Control Command..."
      - lambda: |-
          // Исходные данные команды
          uint8_t raw_data = {0x01, 0x06, 0x00, 0x26, 0x00, 0x01};
          uint16_t crc = 0xFFFF;
          
          // Расчет CRC16 (Modbus)
          for (int i = 0; i < 6; i++) {
            crc ^= raw_data[i];
            for (int j = 0; j < 8; j++) {
              if (crc & 0x0001) {
                crc = (crc >> 1) ^ 0xA001;
              } else {
                crc = crc >> 1;
              }
            }
          }
          
          // Формирование финального пакета (8 байт)
          uint8_t final_packet;
          for(int i = 0; i < 6; i++) {
            final_packet[i] = raw_data[i];
          }
          // Добавляем младший байт CRC
          final_packet = (uint8_t)(crc & 0xFF);
          // Добавляем старший байт CRC
          final_packet = (uint8_t)(crc >> 8);
          
          // Отправка через UART инвертора
          id(inverter_uart).write(final_packet, 8);
      
      - delay: 200ms
      // Чтение происходит автоматически благодаря text_sensor выше.
      // Действия uart.read здесь нет и быть не должно.

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"

interval:
  - interval: 5s
    then:
      - script.execute: send_voltronic_bms_command
