esphome:
  name: jk-bms-voltronic-38
  friendly_name: "JK BMS Voltronic Mode"

# ЭТОТ БЛОК КРИТИЧЕСКИ ВАЖЕН: он подключает внешний компонент для JK-BMS
external_components:
  - source: github://syssi/esphome-jk-bms@main
    components: [jk_bms]

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !env_var WIFI_SSID
  password: !env_var WIFI_PASSWORD
  ap:
    ssid: "BMS-Setup-Portal"
    password: "password123"
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

captive_portal:

logger:
  level: DEBUG
  baud_rate: 0

# Один блок uart с двумя ID (исправлено от ошибки Duplicate key)
uart:
  - id: bms_uart
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 115200
    parity: NONE
    stop_bits: 1

  - id: inverter_uart
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 9600
    parity: NONE
    stop_bits: 1

# Теперь этот компонент будет найден благодаря external_components выше
jk_bms:
  id: jk_bms_sensor
  uart_id: bms_uart
  update_interval: 5s

script:
  - id: send_voltronic_bms_command
    mode: single
    then:
      - logger.log: "Sending Voltronic BMS Control Command (Reg 38)..."
      - lambda: |-
          uint8_t raw_data = {0x01, 0x06, 0x00, 0x26, 0x00, 0x01};
          uint16_t crc = 0xFFFF;
          for (int i = 0; i < 6; i++) {
            crc ^= raw_data[i];
            for (int j = 0; j < 8; j++) {
              if (crc & 0x0001) crc = (crc >> 1) ^ 0xA001;
              else crc = crc >> 1;
            }
          }
          uint8_t final_packet = {
            raw_data, raw_data, raw_data, raw_data, [1](https://github.com/syssi/esphome-jk-bms/issues/338)[2](https://dzen.ru/a/aUBa1yAviViNAEw6)[3](https://github.com/syssi/esphome-jk-bms)
            raw_data, raw_data, [4](https://coder.social/syssi/esphome-jk-bms/issues/327)[5](https://github.com/Uksa007/esphome-jk-bms-can)
            (uint8_t)(crc & 0xFF), (uint8_t)(crc >> 8)
          };
          id(inverter_uart).write(final_packet, 8);
      - delay: 200ms
      - uart.read:
          uart_id: inverter_uart
          id: inverter_resp
          on_data:
            then:
              - logger.log: "Inverter ACK received: %s"
                variables:
                  data_str: "data"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"

interval:
  - interval: 5s
    then:
      - script.execute: send_voltronic_bms_command
