esphome:
  name: "jk-bms"
  friendly_name: "JK-BMS Monitoring"

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

uart:
  - id: uart_bms
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 115200
  - id: uart_inverter
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 9600

wifi:
  ssid: ${WIFI_SSID}
  password: ${WIFI_PASSWORD}
  ap_timeout: 15s
  ap:
    ssid: "BMS-Setup-Portal"
    password: "password123"
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0


mdns:
captive_portal:
api:
ota:
  - platform: esphome
    password: "supersecretota123"   # <-- Пароль для OTA

logger:
  level: DEBUG
  baud_rate: 0

custom_component:
  - lambda: |-
      #include <esphome/core/component.h>
      #include <esphome/components/uart/uart.h>
      #include <vector>

      class JkToVoltronicBridge : public PollingComponent {
       public:
        float bms_voltage = 24.0;
        float bms_current = 0.0;
        float bms_soc = 50.0;

        JkToVoltronicBridge() : PollingComponent(1000) {}

        void setup() override {
          ESP_LOGI("custom", "JK-BD4A24S10P -> TY-SIC-3.6KBE-W1 bridge started.");
        }

        void update() override {
          auto *bms_uart = id(uart_bms);
          auto *inv_uart = id(uart_inverter);

          while (bms_uart->available() > 0) {
            uint8_t start_byte;
            if (!bms_uart->read_byte(&start_byte)) break;
            if (start_byte != 0x4E) continue;

            uint8_t header_type;
            if (!bms_uart->read_byte(&header_type) || header_type != 0x57) continue;

            uint8_t len_h, len_l;
            if (!bms_uart->read_byte(&len_h) || !bms_uart->read_byte(&len_l)) continue;
            uint16_t packet_len = ((uint16_t)len_h << 8) | len_l;

            if (packet_len < 40 || packet_len > 400) continue;

            std::vector<uint8_t> buf;
            buf.reserve(packet_len);
            buf.push_back(0x4E);
            buf.push_back(0x57);
            buf.push_back(len_h);
            buf.push_back(len_l);

            long start_time = millis();
            bool ok = true;
            while (buf.size() < packet_len && (millis() - start_time < 250)) {
              uint8_t b;
              if (bms_uart->read_byte(&b)) {
                buf.push_back(b);
              } else {
                ok = false;
                break;
              }
            }

            if (!ok || buf.size() != packet_len) {
              while (bms_uart->available() > 0) {
                uint8_t d;
                bms_uart->read_byte(&d);
              }
              return;
            }

            uint32_t crc_calc = 0;
            for (size_t i = 0; i < packet_len - 4; i++) crc_calc += buf[i];

            uint32_t crc_remote = ((uint32_t)buf[packet_len - 4] << 24) |
                                  ((uint32_t)buf[packet_len - 3] << 16) |
                                  ((uint32_t)buf[packet_len - 2] << 8)  |
                                  (uint32_t)buf[packet_len - 1];

            if (crc_calc != crc_remote) {
              ESP_LOGW("custom", "CRC mismatch. Skipping frame.");
              return;
            }

            size_t i = 4;
            while (i < (size_t)(packet_len - 5)) {
              uint8_t id = buf[i];
              if (id == 0x83 && i + 2 < packet_len) {
                uint16_t raw = ((uint16_t)buf[i + 1] << 8) | buf[i + 2];
                bms_voltage = raw * 0.001;
                i += 3;
              } else if (id == 0x84 && i + 2 < packet_len) {
                uint16_t raw = ((uint16_t)buf[i + 1] << 8) | buf[i + 2];
                if (raw & 0x8000) {
                  bms_current = (raw & 0x7FFF) * -0.01;
                } else {
                  bms_current = raw * 0.01;
                }
                if (bms_current > 100.0) bms_current = 100.0;
                if (bms_current < -100.0) bms_current = -100.0;
                i += 3;
              } else if (id == 0x85 && i + 1 < packet_len) {
                bms_soc = buf[i + 1];
                if (bms_soc > 100) bms_soc = 100;
                i += 2;
              } else {
                i++;
              }
            }
            ESP_LOGD("custom", "JK-BD4A parsed: V=%.2fV, I=%.2fA, SOC=%.0f%%", bms_voltage, bms_current, bms_soc);
          }

          if (inv_uart->available() > 0) {
            uint8_t cmd;
            if (!inv_uart->read_byte(&cmd)) return;

            if (cmd == 0x69 || cmd == 0x7E) {
              while (inv_uart->available() > 0) {
                uint8_t d;
                inv_uart->read_byte(&d);
              }

              std::vector<uint8_t> resp;
              resp.push_back(0x69);
              resp.push_back(0x0D);
              resp.push_back((uint8_t)bms_soc);

              uint16_t v_raw = (uint16_t)(bms_voltage * 1000);
              resp.push_back((v_raw >> 8) & 0xFF);
              resp.push_back(v_raw & 0xFF);

              int16_t c_shifted = (int16_t)(bms_current * 10.0 + 5000.0);
              if (c_shifted < 0) c_shifted = 0;
              if (c_shifted > 9999) c_shifted = 9999;
              uint16_t c_raw = (uint16_t)c_shifted;
              resp.push_back((c_raw >> 8) & 0xFF);
              resp.push_back(c_raw & 0xFF);

              resp.push_back(0x0D);

              inv_uart->write_array(resp);
              ESP_LOGI("custom", "Voltronic reply: V=%.2fV, SOC=%.0f%%", bms_voltage, bms_soc);
            }
          }
        }
      };

      auto my_bridge = new JkToVoltronicBridge();
      return {my_bridge};
