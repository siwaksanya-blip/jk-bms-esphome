esphome:
  name: jk-bms-rocksolid
  friendly_name: "JK BMS Stable"

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !env_var WIFI_SSID
  password: !env_var WIFI_PASSWORD
  ap:
    ssid: "BMS-Portal"
    password: "12345678"
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

captive_portal:

logger:
  level: DEBUG
  baud_rate: 0

uart:
  - id: bms_uart
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 115200
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512
  - id: inverter_uart
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 9600
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256

text_sensor:
  - platform: uart
    uart_id: inverter_uart
    name: "Inverter Data"
    id: inverter_resp
    # Максимально простой блок on_value, без переменных, чтобы не ломать YAML
    on_value:
      then:
        - logger.log: "Raw data received from inverter"

script:
  - id: send_cmd
    mode: single
    then:
      - logger.log: "Executing Modbus write command"
      - lambda: |-
          // Данные команды
          uint8_t raw_data = {0x01, 0x06, 0x00, 0x26, 0x00, 0x01};
          uint16_t crc = 0xFFFF;
          
          // Расчет CRC16
          for (int i = 0; i < 6; i++) {
            crc ^= raw_data[i];
            for (int j = 0; j < 8; j++) {
              if (crc & 0x0001) {
                crc = (crc >> 1) ^ 0xA001;
              } else {
                crc = crc >> 1;
              }
            }
          }
          
          // ИСПРАВЛЕНО: Массив объявлен с размером 8 байт
          uint8_t final_packet;
          
          // Копируем исходные данные
          for(int i = 0; i < 6; i++) {
            final_packet[i] = raw_data[i];
          }
          // Добавляем CRC (Low)
          final_packet = (uint8_t)(crc & 0xFF);
          // Добавляем CRC (High)
          final_packet = (uint8_t)(crc >> 8);
          
          // Отправляем 8 байт
          id(inverter_uart).write(final_packet, 8);
      - delay: 200ms

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

interval:
  - interval: 5s
    then:
      - script.execute: send_cmd
