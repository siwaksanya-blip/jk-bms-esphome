esphome:
  name: jk-bms
  friendly_name: "JK BMS Monitor"

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !env_var WIFI_SSID
  password: !env_var WIFI_PASSWORD
  
  ap:
    ssid: "BMS-Setup-Portal"
    password: "password123"
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

captive_portal:

logger:
  level: DEBUG

# UART для BMS: TX на 16, RX на 17 (это работает на ESP32)
uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  id: bms_uart

sensor:
  - platform: uptime
    name: "Uptime"
  
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

  # ЗАГЛУШКИ ВМЕСТО ADC НА 18 И 19
  # Эти сенсоры не требуют аналоговых пинов и не вызовут ошибку сборки.
  # Если на 18 и 19 у тебя реле — позже мы добавим туда output.
  # Если кнопки — binary_sensor.
  - platform: template
    name: "Pin 18 Status (Placeholder)"
    lambda: return 0.0;
    unit_of_measurement: "V"
    icon: "mdi:help-circle"

  - platform: template
    name: "Pin 19 Status (Placeholder)"
    lambda: return 0.0;
    unit_of_measurement: "V"
    icon: "mdi:help-circle"

text_sensor:
  - platform: version
    name: "ESPHome Version"
